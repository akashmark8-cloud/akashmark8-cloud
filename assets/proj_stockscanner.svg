<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    @keyframes hue { 0% { stop-color:#3b82f6; } 50% { stop-color:#8b5cf6; } 100% { stop-color:#10b981; } }
    .border stop { animation: hue 7s ease-in-out infinite 0.5s; }
    .border stop:nth-of-type(2) { animation-delay: 1.2s; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .icon { animation: bob 3.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 55%,100% { transform: translateX(500px); } }
    .shimmer { animation: sweep 5.5s ease-in-out infinite 1.2s; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .t1 { animation: fadein 0.6s 0.15s both; }
    .t2 { animation: fadein 0.6s 0.45s both; }
    .t3 { animation: fadein 0.6s 0.75s both; }
    @keyframes drawup { 0% { stroke-dashoffset: 90; } 60%,100% { stroke-dashoffset: 0; } }
    .trend { stroke-dasharray: 90; animation: drawup 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .candle { animation: pulse 2.6s ease-in-out infinite; }
    .c2 { animation-delay: 0.5s; } .c3 { animation-delay: 1s; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="398" height="278" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="398" height="278" rx="16" fill="url(#bg)" stroke="url(#stroke)" stroke-width="2"/>

  <g clip-path="url(#clip)">
    <rect class="shimmer" x="0" y="-40" width="110" height="360" transform="rotate(18)" fill="url(#shine)"/>
  </g>

  <!-- icon: candlestick chart with rising trend -->
  <g class="icon">
    <circle cx="200" cy="72" r="32" fill="#3b82f6" fill-opacity="0.12"/>
    <line class="candle c1" x1="182" y1="50" x2="182" y2="92" stroke="#334155" stroke-width="2"/>
    <rect class="candle c1" x="176" y="58" width="12" height="24" rx="2" fill="#34d399"/>
    <line class="candle c2" x1="200" y1="44" x2="200" y2="94" stroke="#334155" stroke-width="2"/>
    <rect class="candle c2" x="194" y="52" width="12" height="30" rx="2" fill="#34d399"/>
    <line class="candle c3" x1="218" y1="40" x2="218" y2="86" stroke="#334155" stroke-width="2"/>
    <rect class="candle c3" x="212" y="46" width="12" height="26" rx="2" fill="#60a5fa"/>
    <polyline class="trend" points="172,82 194,64 212,72 230,48" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="224,48 231,47 230,54" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="t1" x="200" y="146" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Stock Scanner</text>
  <text class="t2" x="200" y="172" text-anchor="middle" font-size="12.5" fill="#94a3b8">ML predictions for Indian markets</text>
  <text class="t2" x="200" y="190" text-anchor="middle" font-size="12.5" fill="#94a3b8">Groww watchlist ready</text>

  <g class="t3">
    <rect x="115" y="212" width="54" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="142" y="226" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Python</text>
    <rect x="181" y="212" width="34" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="198" y="226" text-anchor="middle" font-size="10.5" fill="#cbd5e1">ML</text>
    <rect x="227" y="212" width="58" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="256" y="226" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Finance</text>
    <text x="200" y="258" text-anchor="middle" font-size="9.5" fill="#475569">github.com/akashmark8-cloud/stock-scanner</text>
  </g>
</svg>
