<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    @keyframes hue { 0% { stop-color:#8b5cf6; } 50% { stop-color:#10b981; } 100% { stop-color:#3b82f6; } }
    .border stop { animation: hue 7s ease-in-out infinite 1s; }
    .border stop:nth-of-type(2) { animation-delay: 1.7s; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .icon { animation: bob 3.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 55%,100% { transform: translateX(500px); } }
    .shimmer { animation: sweep 5.5s ease-in-out infinite 2.4s; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .t1 { animation: fadein 0.6s 0.15s both; }
    .t2 { animation: fadein 0.6s 0.45s both; }
    .t3 { animation: fadein 0.6s 0.75s both; }
    @keyframes sendUp { 0%,15% { transform: translateY(6px); opacity: 0.4; } 45%,100% { transform: translateY(-8px); opacity: 1; } }
    @keyframes sendDown { 0%,15% { transform: translateY(-6px); opacity: 0.4; } 45%,100% { transform: translateY(8px); opacity: 1; } }
    .up { animation: sendUp 2.4s ease-in-out infinite; }
    .down { animation: sendDown 2.4s ease-in-out infinite 0.6s; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="398" height="278" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="398" height="278" rx="16" fill="url(#bg)" stroke="url(#stroke)" stroke-width="2"/>

  <g clip-path="url(#clip)">
    <rect class="shimmer" x="0" y="-40" width="110" height="360" transform="rotate(18)" fill="url(#shine)"/>
  </g>

  <!-- icon: cloud with up/down transfer arrows -->
  <g class="icon">
    <circle cx="200" cy="72" r="32" fill="#60a5fa" fill-opacity="0.12"/>
    <path d="M182 76 a9 9 0 0 1 2-17.8 a12 12 0 0 1 23-3.2 a9.5 9.5 0 0 1 11 14.5 q-3 6.5-11 6.5 z"
          fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa" stroke-width="1.6"/>
    <g class="up">
      <line x1="190" y1="96" x2="190" y2="84" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
      <polyline points="185,89 190,83 195,89" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="down">
      <line x1="212" y1="84" x2="212" y2="96" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <polyline points="207,91 212,97 217,91" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text class="t1" x="200" y="146" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">FileShare</text>
  <text class="t2" x="200" y="172" text-anchor="middle" font-size="12.5" fill="#94a3b8">Simple web file sharing</text>
  <text class="t2" x="200" y="190" text-anchor="middle" font-size="12.5" fill="#94a3b8">upload, share, done</text>

  <g class="t3">
    <rect x="152" y="212" width="46" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="175" y="226" text-anchor="middle" font-size="10.5" fill="#cbd5e1">HTML</text>
    <rect x="210" y="212" width="38" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="229" y="226" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Web</text>
    <text x="200" y="258" text-anchor="middle" font-size="9.5" fill="#475569">github.com/akashmark8-cloud/fileshare</text>
  </g>
</svg>
