<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    @keyframes barhue {
      0%   { stop-color: #10b981; }
      50%  { stop-color: #3b82f6; }
      100% { stop-color: #8b5cf6; }
    }
    .barGrad stop { animation: barhue 6s ease-in-out infinite; }
    .barGrad stop:nth-of-type(2) { animation-delay: 0.8s; }
    .barGrad stop:nth-of-type(3) { animation-delay: 1.6s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .term-line { opacity: 0; animation: fadeUp 0.5s ease-out forwards; }
    .l1 { animation-delay: 0.2s; }
    .l2 { animation-delay: 0.9s; }
    .l3 { animation-delay: 1.7s; }
    .l4 { animation-delay: 2.5s; }
    .l5 { animation-delay: 3.3s; }
    .l6 { animation-delay: 4.1s; }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }
    .bob { animation: bob 4.5s ease-in-out infinite; }

    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .dots circle { animation: twinkle 3.2s ease-in-out infinite; }
    .dots circle:nth-of-type(3n)   { animation-delay: 1.1s; }
    .dots circle:nth-of-type(3n+1) { animation-delay: 2.2s; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient class="barGrad" id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- twinkling grid dots -->
  <g class="dots" fill="#334155">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="180" cy="60" r="2"/><circle cx="240" cy="60" r="2"/><circle cx="300" cy="60" r="2"/><circle cx="360" cy="60" r="2"/>
    <circle cx="60" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="180" cy="120" r="2"/><circle cx="240" cy="120" r="2"/><circle cx="300" cy="120" r="2"/><circle cx="360" cy="120" r="2"/>
    <circle cx="60" cy="180" r="2"/><circle cx="120" cy="180" r="2"/><circle cx="180" cy="180" r="2"/><circle cx="240" cy="180" r="2"/><circle cx="300" cy="180" r="2"/><circle cx="360" cy="180" r="2"/>
  </g>

  <!-- animated accent bar -->
  <rect x="70" y="120" width="8" height="120" rx="4" fill="url(#accent)"/>

  <!-- headline -->
  <text x="110" y="150" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="2">KENNY</text>
  <text x="112" y="182" font-size="18" fill="#94a3b8">Python developer · turning everyday problems into clean, practical tools</text>
  <text x="112" y="210" font-size="14" fill="#64748b">SkipLink · Stock Scanner · FileShare · Arch Linux · dev.to</text>

  <!-- terminal window -->
  <g class="bob">
    <rect x="930" y="105" width="300" height="175" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <circle cx="952" cy="126" r="5" fill="#f87171"/>
    <circle cx="968" cy="126" r="5" fill="#fbbf24"/>
    <circle cx="984" cy="126" r="5" fill="#34d399"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
      <text class="term-line l1" x="948" y="156" fill="#94a3b8">$ cd ~/kenny</text>
      <text class="term-line l2" x="948" y="178" fill="#94a3b8">$ python tools.py</text>
      <text class="term-line l3" x="948" y="200" fill="#34d399">ok - clean, no bloat</text>
      <text class="term-line l4" x="948" y="222" fill="#94a3b8">$ skiplink short.link</text>
      <text class="term-line l5" x="948" y="244" fill="#34d399">real link - 0 ads</text>
      <text class="term-line l6" x="948" y="266" fill="#94a3b8">$ _</text>
    </g>
    <rect class="cursor" x="962" y="255" width="8" height="14" fill="#34d399"/>
  </g>

  <!-- bottom accent line -->
  <rect x="70" y="310" width="1140" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="110" y="338" font-size="13" fill="#475569">@akashmark8-cloud</text>
  <text x="1170" y="338" text-anchor="end" font-size="13" fill="#475569">github.com/akashmark8-cloud</text>
</svg>
