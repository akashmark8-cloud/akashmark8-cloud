<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    @keyframes neonhue { 0% { stop-color:#00fff7; } 33% { stop-color:#ff2ec4; } 66% { stop-color:#7b2eff; } 100% { stop-color:#00fff7; } }
    .neonborder stop { animation: neonhue 6s linear infinite; }
    .neonborder stop:nth-of-type(2) { animation-delay: 2s; }
    @keyframes scanmove { 0% { transform: translateY(-30px); } 100% { transform: translateY(320px); } }
    .scanline { animation: scanmove 4s linear infinite; }
    @keyframes flicker { 0%,91%,94%,98%,100% { opacity: 1; } 92% { opacity: 0.45; } 96% { opacity: 0.7; } }
    .neontext { animation: flicker 3.9s linear infinite; }
    @keyframes glitchA {
      0%,84%,100% { transform: translate(0,0); opacity: 0; }
      85% { transform: translate(-2.5px,1px); opacity: 1; }
      87% { transform: translate(2px,-1px); opacity: 1; }
      89% { transform: translate(-1px,-1px); opacity: 1; }
      91% { transform: translate(0,0); opacity: 0; }
    }
    @keyframes glitchB {
      0%,80%,100% { transform: translate(0,0); opacity: 0; }
      81% { transform: translate(2.5px,-1px); opacity: 1; }
      83% { transform: translate(-2px,1px); opacity: 1; }
      85% { transform: translate(1px,1px); opacity: 1; }
      87% { transform: translate(0,0); opacity: 0; }
    }
    .gcyan { animation: glitchA 4.2s steps(1) infinite; }
    .gmagenta { animation: glitchB 4.2s steps(1) infinite 1.1s; }
    @keyframes livedot { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .live { animation: livedot 1.6s ease-in-out infinite; }
    @keyframes gridroll { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -28; } }
    .gridline { stroke-dasharray: 14 14; animation: gridroll 3s linear infinite; }
  </style>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060f"/><stop offset="1" stop-color="#120a26"/>
    </linearGradient>
    <linearGradient class="neonborder" id="nstroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00fff7"/><stop offset="0.5" stop-color="#ff2ec4"/><stop offset="1" stop-color="#7b2eff"/>
    </linearGradient>
    <linearGradient id="scanfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00fff7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00fff7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00fff7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="1.5" y="1.5" width="397" height="277" rx="14"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="397" height="277" rx="14" fill="url(#cbg)" stroke="url(#nstroke)" stroke-width="2"/>

  <!-- HUD corner brackets -->
  <g stroke="#00fff7" stroke-width="2" fill="none" opacity="0.85">
    <path d="M14 30 V14 H30"/><path d="M370 14 H386 V30"/>
    <path d="M386 250 V266 H370"/><path d="M30 266 H14 V250"/>
  </g>

  <g clip-path="url(#cardclip)">
    <!-- faint perspective grid -->
    <g stroke="#1b1440" stroke-width="1">
      <line class="gridline" x1="0" y1="238" x2="400" y2="238"/>
      <line class="gridline" x1="0" y1="252" x2="400" y2="252" opacity="0.7"/>
      <line class="gridline" x1="0" y1="266" x2="400" y2="266" opacity="0.45"/>
    </g>
    <!-- rolling scanline -->
    <rect class="scanline" x="0" y="0" width="400" height="16" fill="url(#scanfade)"/>
    <!-- scanline texture -->
    <g fill="#ffffff" opacity="0.03">
      <rect x="0" y="6" width="400" height="1"/>
      <rect x="0" y="12" width="400" height="1"/>
      <rect x="0" y="18" width="400" height="1"/>
      <rect x="0" y="24" width="400" height="1"/>
      <rect x="0" y="30" width="400" height="1"/>
      <rect x="0" y="36" width="400" height="1"/>
      <rect x="0" y="42" width="400" height="1"/>
      <rect x="0" y="48" width="400" height="1"/>
      <rect x="0" y="54" width="400" height="1"/>
      <rect x="0" y="60" width="400" height="1"/>
      <rect x="0" y="66" width="400" height="1"/>
      <rect x="0" y="72" width="400" height="1"/>
      <rect x="0" y="78" width="400" height="1"/>
      <rect x="0" y="84" width="400" height="1"/>
      <rect x="0" y="90" width="400" height="1"/>
      <rect x="0" y="96" width="400" height="1"/>
      <rect x="0" y="102" width="400" height="1"/>
      <rect x="0" y="108" width="400" height="1"/>
      <rect x="0" y="114" width="400" height="1"/>
      <rect x="0" y="120" width="400" height="1"/>
      <rect x="0" y="126" width="400" height="1"/>
      <rect x="0" y="132" width="400" height="1"/>
      <rect x="0" y="138" width="400" height="1"/>
      <rect x="0" y="144" width="400" height="1"/>
      <rect x="0" y="150" width="400" height="1"/>
      <rect x="0" y="156" width="400" height="1"/>
      <rect x="0" y="162" width="400" height="1"/>
      <rect x="0" y="168" width="400" height="1"/>
      <rect x="0" y="174" width="400" height="1"/>
      <rect x="0" y="180" width="400" height="1"/>
      <rect x="0" y="186" width="400" height="1"/>
      <rect x="0" y="192" width="400" height="1"/>
      <rect x="0" y="198" width="400" height="1"/>
      <rect x="0" y="204" width="400" height="1"/>
      <rect x="0" y="210" width="400" height="1"/>
      <rect x="0" y="216" width="400" height="1"/>
      <rect x="0" y="222" width="400" height="1"/>
      <rect x="0" y="228" width="400" height="1"/>
      <rect x="0" y="234" width="400" height="1"/>
      <rect x="0" y="240" width="400" height="1"/>
      <rect x="0" y="246" width="400" height="1"/>
      <rect x="0" y="252" width="400" height="1"/>
      <rect x="0" y="258" width="400" height="1"/>
      <rect x="0" y="264" width="400" height="1"/>
      <rect x="0" y="270" width="400" height="1"/>
      <rect x="0" y="276" width="400" height="1"/>
    </g>
  </g>

  <!-- header row -->
  <circle cx="30" cy="36" r="6" fill="#f34b7d"/>
  <text x="44" y="41" font-size="12" fill="#9fb4c7" font-family="'JetBrains Mono', Consolas, monospace">C++</text>
  <circle class="live" cx="352" cy="35" r="4" fill="#39ff88"/>
  <text x="360" y="39" font-size="10" fill="#39ff88" font-family="'JetBrains Mono', Consolas, monospace">LIVE</text>

  <!-- glitching title -->
  <g font-size="24" font-weight="800">
    <text class="gcyan" x="198" y="92" text-anchor="middle" fill="#00fff7" opacity="0">codexray</text>
    <text class="gmagenta" x="202" y="94" text-anchor="middle" fill="#ff2ec4" opacity="0">codexray</text>
    <text class="neontext" x="200" y="93" text-anchor="middle" fill="#f4f7ff">codexray</text>
  </g>

  <!-- description -->
  <text x="200" y="126" text-anchor="middle" font-size="12.5" fill="#b8c7d9">X-ray vision for your codebase: fast C++</text>
  <text x="200" y="145" text-anchor="middle" font-size="12.5" fill="#b8c7d9">symbol indexer + MCP server for AI...</text>

  <!-- stat chips -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11">
    <rect x="106" y="168" width="72" height="22" rx="11" fill="#0d1226" stroke="#00fff7" stroke-opacity="0.55"/>
    <text x="142" y="183" text-anchor="middle" fill="#00fff7">&#9733; 1</text>
    <rect x="186" y="168" width="66" height="22" rx="11" fill="#0d1226" stroke="#ff2ec4" stroke-opacity="0.55"/>
    <text x="219" y="183" text-anchor="middle" fill="#ff2ec4">&#9023; 0</text>
    <rect x="260" y="168" width="55" height="22" rx="11" fill="#0d1226" stroke="#f34b7d" stroke-opacity="0.7"/>
    <text x="287" y="183" text-anchor="middle" fill="#f34b7d">C++</text>
  </g>

  <!-- footer -->
  <text x="200" y="228" text-anchor="middle" font-size="10" fill="#5b6b85" font-family="'JetBrains Mono', Consolas, monospace">github.com/akashmark8-cloud/codexray</text>
  <text x="200" y="248" text-anchor="middle" font-size="9" fill="#3f4d63" letter-spacing="2">// SYSTEM ONLINE //</text>
</svg>
