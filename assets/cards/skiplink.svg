<svg xmlns="http://www.w3.org/2000/svg" width="420" height="270" viewBox="0 0 420 270" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <style>
    @keyframes neonhue {
      0%   { stop-color: #00fff7; }
      33%  { stop-color: #ff2ec4; }
      66%  { stop-color: #7b2eff; }
      100% { stop-color: #00fff7; }
    }
    .neonborder stop { animation: neonhue 6.5s linear infinite 1.4s; }
    .neonborder stop:nth-of-type(2) { animation-delay: 2.8s; }

    @keyframes scanmove {
      0%   { transform: translateY(-30px); }
      100% { transform: translateY(300px); }
    }
    .scanline { animation: scanmove 4.2s linear infinite 1.4s; }

    @keyframes flicker {
      0%, 91%, 94%, 98%, 100% { opacity: 1; }
      92% { opacity: 0.48; }
      96% { opacity: 0.72; }
    }
    .neontext { animation: flicker 4.2s linear infinite 1.4s; }

    @keyframes glitchA {
      0%, 84%, 100% { transform: translate(0, 0); opacity: 0; }
      85% { transform: translate(-2.5px, 1px); opacity: 0.95; }
      87% { transform: translate(2px, -1px); opacity: 0.9; }
      89% { transform: translate(-1px, -1px); opacity: 0.95; }
      91% { transform: translate(0, 0); opacity: 0; }
    }
    @keyframes glitchB {
      0%, 80%, 100% { transform: translate(0, 0); opacity: 0; }
      81% { transform: translate(2.5px, -1px); opacity: 0.95; }
      83% { transform: translate(-2px, 1px); opacity: 0.9; }
      85% { transform: translate(1px, 1px); opacity: 0.95; }
      87% { transform: translate(0, 0); opacity: 0; }
    }
    .gcyan    { animation: glitchA 4.6s steps(1) infinite 1.4s; }
    .gmagenta { animation: glitchB 4.6s steps(1) infinite 2.8s; }

    @keyframes livedot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.3; transform: scale(0.8); }
    }
    .live { transform-origin: 344px 33px; animation: livedot 1.7s ease-in-out infinite; }

    @keyframes gridroll {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -28; }
    }
    .gridline { stroke-dasharray: 14 14; animation: gridroll 3s linear infinite; }

    @keyframes edgePulse {
      0%   { transform: translateX(-90px); opacity: 0; }
      20%  { opacity: 0.95; }
      80%  { opacity: 0.95; }
      100% { transform: translateX(430px); opacity: 0; }
    }
    .edge-pk { animation: edgePulse 3.8s linear infinite 1.4s; }
  </style>

  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#050610"/>
      <stop offset="1" stop-color="#110926"/>
    </linearGradient>
    <linearGradient class="neonborder" id="nstroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00fff7"/>
      <stop offset="0.5" stop-color="#ff2ec4"/>
      <stop offset="1" stop-color="#7b2eff"/>
    </linearGradient>
    <linearGradient id="scanfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00fff7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00fff7" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#00fff7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pkgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00fff7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00fff7" stop-opacity="1"/>
      <stop offset="100" stop-color="#ff2ec4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="1.5" y="1.5" width="417" height="267" rx="14"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="417" height="267" rx="14" fill="url(#cbg)" stroke="url(#nstroke)" stroke-width="2"/>

  <!-- HUD Corner Brackets -->
  <g stroke="#00fff7" stroke-width="2.2" fill="none" opacity="0.9">
    <path d="M14 30 V14 H30"/>
    <path d="M390 14 H406 V30"/>
    <path d="M406 240 V256 H390" stroke="#ff2ec4"/>
    <path d="M30 256 H14 V240" stroke="#ff2ec4"/>
  </g>

  <g clip-path="url(#cardclip)">
    <g stroke="#1b1442" stroke-width="1">
      <line class="gridline" x1="0" y1="226" x2="420" y2="226"/>
      <line class="gridline" x1="0" y1="242" x2="420" y2="242" opacity="0.7"/>
      <line class="gridline" x1="0" y1="258" x2="420" y2="258" opacity="0.45"/>
    </g>
    <rect class="scanline" x="0" y="0" width="420" height="18" fill="url(#scanfade)"/>
    <rect class="edge-pk" x="0" y="1" width="80" height="3" fill="url(#pkgrad)"/>
    <g fill="#ffffff" opacity="0.025">
      <rect x="0" y="6" width="420" height="1"/>
      <rect x="0" y="12" width="420" height="1"/>
      <rect x="0" y="18" width="420" height="1"/>
      <rect x="0" y="24" width="420" height="1"/>
      <rect x="0" y="30" width="420" height="1"/>
      <rect x="0" y="36" width="420" height="1"/>
      <rect x="0" y="42" width="420" height="1"/>
      <rect x="0" y="48" width="420" height="1"/>
      <rect x="0" y="54" width="420" height="1"/>
      <rect x="0" y="60" width="420" height="1"/>
      <rect x="0" y="66" width="420" height="1"/>
      <rect x="0" y="72" width="420" height="1"/>
      <rect x="0" y="78" width="420" height="1"/>
      <rect x="0" y="84" width="420" height="1"/>
      <rect x="0" y="90" width="420" height="1"/>
      <rect x="0" y="96" width="420" height="1"/>
      <rect x="0" y="102" width="420" height="1"/>
      <rect x="0" y="108" width="420" height="1"/>
      <rect x="0" y="114" width="420" height="1"/>
      <rect x="0" y="120" width="420" height="1"/>
      <rect x="0" y="126" width="420" height="1"/>
      <rect x="0" y="132" width="420" height="1"/>
      <rect x="0" y="138" width="420" height="1"/>
      <rect x="0" y="144" width="420" height="1"/>
      <rect x="0" y="150" width="420" height="1"/>
      <rect x="0" y="156" width="420" height="1"/>
      <rect x="0" y="162" width="420" height="1"/>
      <rect x="0" y="168" width="420" height="1"/>
      <rect x="0" y="174" width="420" height="1"/>
      <rect x="0" y="180" width="420" height="1"/>
      <rect x="0" y="186" width="420" height="1"/>
      <rect x="0" y="192" width="420" height="1"/>
      <rect x="0" y="198" width="420" height="1"/>
      <rect x="0" y="204" width="420" height="1"/>
      <rect x="0" y="210" width="420" height="1"/>
      <rect x="0" y="216" width="420" height="1"/>
      <rect x="0" y="222" width="420" height="1"/>
      <rect x="0" y="228" width="420" height="1"/>
      <rect x="0" y="234" width="420" height="1"/>
      <rect x="0" y="240" width="420" height="1"/>
      <rect x="0" y="246" width="420" height="1"/>
      <rect x="0" y="252" width="420" height="1"/>
      <rect x="0" y="258" width="420" height="1"/>
      <rect x="0" y="264" width="420" height="1"/>
    </g>
  </g>

  <!-- Header Row -->
  <circle cx="32" cy="34" r="5.5" fill="#38bdf8"/>
  <text x="45" y="38" font-size="11.5" font-weight="700" fill="#cbd5e1" font-family="Consolas, monospace">Python</text>

  <rect x="332" y="22" width="66" height="21" rx="10.5" fill="#061e17" stroke="#39ff88" stroke-opacity="0.55"/>
  <circle class="live" cx="344" cy="33" r="3.5" fill="#39ff88"/>
  <text x="353" y="36.5" font-size="9.5" font-weight="700" fill="#39ff88" font-family="Consolas, monospace">PUBLIC</text>

  <!-- Glitching Title -->
  <g font-size="24" font-weight="800" letter-spacing="0.4">
    <text class="gcyan"    x="208" y="88" text-anchor="middle" fill="#00fff7" opacity="0">skiplink</text>
    <text class="gmagenta" x="212" y="90" text-anchor="middle" fill="#ff2ec4" opacity="0">skiplink</text>
    <text class="neontext" x="210" y="89" text-anchor="middle" fill="#f8fafc">skiplink</text>
  </g>

  <!-- Description -->
  <text x="210" y="122" text-anchor="middle" font-size="12.5" fill="#b8c7d9">One-click bypass for ad-driven URL shorteners —</text>
  <text x="210" y="142" text-anchor="middle" font-size="12.5" fill="#b8c7d9">lands on the real link with zero ads.</text>

  <!-- Centered Stat Chips with Vector Icons -->
  <g font-family="Consolas, monospace" font-size="11" font-weight="700">
    <!-- Stars Chip -->
    <rect x="107" y="166" width="58" height="24" rx="12" fill="#0b1228" stroke="#00fff7" stroke-opacity="0.6"/>
    <path d="M123 173 L124.4 176.2 L127.8 176.5 L125.2 178.7 L126.0 182 L123 180.2 L120.0 182 L120.8 178.7 L118.2 176.5 L121.6 176.2 Z" fill="#00fff7"/>
    <text x="133" y="182" fill="#00fff7">1</text>

    <!-- Forks Chip -->
    <rect x="175" y="166" width="56" height="24" rx="12" fill="#170b26" stroke="#ff2ec4" stroke-opacity="0.6"/>
    <circle cx="187" cy="174" r="1.6" fill="#ff2ec4"/>
    <circle cx="193" cy="174" r="1.6" fill="#ff2ec4"/>
    <circle cx="190" cy="182" r="1.6" fill="#ff2ec4"/>
    <path d="M187 175.5 V178 H193 V175.5 M190 178 V180.5" stroke="#ff2ec4" stroke-width="1.3" fill="none"/>
    <text x="201" y="182" fill="#ff2ec4">0</text>

    <!-- Language / Activity Chip -->
    <rect x="241" y="166" width="72" height="24" rx="12" fill="#0b1228" stroke="#38bdf8" stroke-opacity="0.75"/>
    <text x="277" y="182" text-anchor="middle" fill="#38bdf8">PYTHON</text>
  </g>

  <!-- Footer HUD -->
  <text x="210" y="220" text-anchor="middle" font-size="10.5" fill="#7c8ea8" font-family="Consolas, monospace">&gt; github.com/akashmark8-cloud/skiplink</text>
  <text x="210" y="242" text-anchor="middle" font-size="9.5" fill="#4f5f7a" font-family="Consolas, monospace" letter-spacing="1.6">// UPDATED 2026-08 //</text>
</svg>
