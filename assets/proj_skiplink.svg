<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    @keyframes hue { 0% { stop-color:#10b981; } 50% { stop-color:#3b82f6; } 100% { stop-color:#8b5cf6; } }
    .border stop { animation: hue 7s ease-in-out infinite; }
    .border stop:nth-of-type(2) { animation-delay: 0.7s; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .icon { animation: bob 3.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 55%,100% { transform: translateX(500px); } }
    .shimmer { animation: sweep 5.5s ease-in-out infinite; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .t1 { animation: fadein 0.6s 0.15s both; }
    .t2 { animation: fadein 0.6s 0.45s both; }
    .t3 { animation: fadein 0.6s 0.75s both; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="398" height="278" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="398" height="278" rx="16" fill="url(#bg)" stroke="url(#stroke)" stroke-width="2"/>

  <g clip-path="url(#clip)">
    <rect class="shimmer" x="0" y="-40" width="110" height="360" transform="rotate(18)" fill="url(#shine)"/>
  </g>

  <!-- icon: fast-forward -->
  <g class="icon">
    <circle cx="200" cy="72" r="32" fill="#10b981" fill-opacity="0.12"/>
    <polyline points="188,56 204,72 188,88" fill="none" stroke="#34d399" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="208,56 224,72 208,88" fill="none" stroke="#60a5fa" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="t1" x="200" y="146" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">SkipLink</text>
  <text class="t2" x="200" y="172" text-anchor="middle" font-size="12.5" fill="#94a3b8">Bypass ad-driven shorteners</text>
  <text class="t2" x="200" y="190" text-anchor="middle" font-size="12.5" fill="#94a3b8">in one click - zero ads</text>

  <g class="t3">
    <rect x="91" y="212" width="54" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="118" y="226" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Python</text>
    <rect x="157" y="212" width="62" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="188" y="226" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Tkinter</text>
    <rect x="231" y="212" width="78" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="270" y="226" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Playwright</text>
    <text x="200" y="258" text-anchor="middle" font-size="9.5" fill="#475569">github.com/akashmark8-cloud/skiplink</text>
  </g>
</svg>
